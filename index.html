<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>OKTSHOP17 - Lite</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="container">
    <!-- Header Ringan -->
    <header class="header">
        <h1 class="logo">OKT<span>17</span></h1>
        <div id="user-info-top" class="points-badge hidden">
            <i class="fas fa-coins"></i> <span id="userPoints">0</span>
        </div>
    </header>

    <!-- UI LOGIN -->
    <div id="ui-login" class="page hidden">
        <div class="card">
            <h2>Login Reseller</h2>
            <input id="email" type="email" placeholder="Email">
            <input id="pass" type="password" placeholder="Password">
            <button id="btnLogin" class="btn-main">MASUK</button>
        </div>
    </div>

    <!-- UI MAIN -->
    <div id="ui-main" class="hidden">
        <!-- Home / Katalog -->
        <div id="page-home" class="page">
            <div id="catalog-list" class="grid"></div>
        </div>

        <!-- Tukar Poin -->
        <div id="page-points" class="page hidden">
            <div class="grid" id="points-list"></div>
        </div>

        <!-- Pesanan -->
        <div id="page-cart" class="page hidden">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('unpaid')">Belum Bayar</button>
                <button class="tab" onclick="switchTab('history')">Riwayat</button>
            </div>
            <div id="list-unpaid"></div>
            <div id="list-history" class="hidden"></div>
        </div>

        <!-- Profil & Admin -->
        <div id="page-profile" class="page hidden">
            <div id="admin-section" class="hidden">
                <div class="tabs">
                    <button class="tab active" onclick="switchAdmin('orders')">Order</button>
                    <button class="tab" onclick="switchAdmin('products')">Produk</button>
                </div>
                <div id="adm-orders"></div>
                <div id="adm-products" class="hidden">
                    <input id="pName" placeholder="Nama Barang">
                    <input id="pPrice" type="number" placeholder="Harga">
                    <button id="btnSaveProduct" class="btn-main">Tambah</button>
                </div>
            </div>

            <div id="reseller-section">
                <div class="card">
                    <input id="prof-nama" placeholder="Nama Lengkap">
                    <input id="prof-hp" placeholder="WhatsApp">
                    <textarea id="prof-alamat" placeholder="Alamat"></textarea>
                    <button id="btnUpdateProfile" class="btn-main">Update Profil</button>
                </div>
            </div>
            <button onclick="logout()" class="btn-danger">Keluar Akun</button>
        </div>

        <!-- Navigasi -->
        <nav class="nav">
            <div class="nav-btn active" onclick="showPage('page-home', this)"><i class="fas fa-store"></i></div>
            <div class="nav-btn" onclick="showPage('page-points', this)"><i class="fas fa-gift"></i></div>
            <div class="nav-btn" onclick="showPage('page-cart', this)"><i class="fas fa-shopping-bag"></i></div>
            <div class="nav-btn" onclick="showPage('page-profile', this)"><i class="fas fa-user"></i></div>
        </nav>
    </div>
</div>

<!-- Modal Pembayaran -->
<div id="modal-pay" class="modal hidden">
    <div class="modal-content">
        <h3>Selesaikan Pembayaran</h3>
        <p id="pay-info" style="font-size: 14px; color: #ccc;"></p>
        <div class="bank-box">
            <p>Transfer Ke: <b>DANA / OVO</b></p>
            <p class="copy-text">0812-XXXX-XXXX</p>
        </div>
        <p style="font-size: 12px; margin: 10px 0;">Kirim bukti foto transfer & nomor order ke WA Admin:</p>
        <button id="btnConfirmWA" class="btn-wa"><i class="fab fa-whatsapp"></i> KONFIRMASI WA</button>
        <button onclick="closeModal()" class="btn-close">Nanti Saja</button>
    </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
