<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>OKTSHOP17 - Pro System</title>
    <style>
        :root { --primary: #e60000; --bg: #111; --card: #1f1f1f; --text: #fff; --gold: #ffd700; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; padding-bottom: 80px; }
        .wrap { max-width: 600px; margin: auto; }
        .card { background: var(--card); padding: 20px; border-radius: 18px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .hidden { display: none; }
        input, button, textarea { width: 100%; padding: 12px; margin-top: 10px; border-radius: 10px; border: 1px solid #333; background: #2a2a2a; color: #fff; box-sizing: border-box; }
        button { background: var(--primary); font-weight: 700; cursor: pointer; border: none; }
        .btn-blue { background: #007bff; }
        .btn-green { background: #28a745; }
        .btn-gray { background: #555; }
        .gold { color: var(--gold); }
        
        /* Katalog Grid */
        .catalog-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .prod-card { background: #2a2a2a; padding: 10px; border-radius: 12px; text-align: center; }
        .prod-price { color: #00ff66; font-weight: bold; font-size: 14px; }
        .prod-btns { display: flex; gap: 5px; margin-top: 10px; }
        .prod-btns button { padding: 8px 2px; font-size: 11px; margin: 0; }

        /* Navigasi Bawah Reseller */
        .nav-bottom { position: fixed; bottom: 0; left: 0; right: 0; background: #1f1f1f; display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid #333; z-index: 100; }
        .nav-item { text-align: center; cursor: pointer; font-size: 12px; color: gray; }
        .nav-item.active { color: var(--primary); }

        /* Order Card */
        .order-card { background: #2a2a2a; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 5px solid var(--primary); }
        .status-badge { padding: 4px 8px; border-radius: 5px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab { flex: 1; text-align: center; padding: 10px; background: #2a2a2a; border-radius: 10px; cursor: pointer; }
        .tab.active { background: var(--primary); }
    </style>
</head>
<body>

<div class="wrap">
    <div class="card" style="text-align:center"><h1 class="gold">OKTSHOP17</h1></div>
    <div id="loading" class="hidden" style="text-align:center; color:var(--gold)">Memproses...</div>

    <!-- UI LOGIN -->
    <div id="ui-login" class="card">
        <h3>Login System</h3>
        <input id="email" type="email" placeholder="Email">
        <input id="pass" type="password" placeholder="Password">
        <button id="btnLogin">Masuk</button>
    </div>

    <!-- UI ADMIN -->
    <div id="ui-admin" class="hidden">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('admin-katalog')">Katalog</div>
            <div class="tab" onclick="switchTab('admin-rekening')">Rekening</div>
            <div class="tab" onclick="switchTab('admin-pesanan')">Pesanan</div>
        </div>

        <div id="admin-katalog" class="tab-content">
            <div class="card">
                <small>Tambah Produk</small>
                <input id="pName" placeholder="Nama Barang">
                <input id="pPrice" type="number" placeholder="Harga">
                <input id="pStock" type="number" placeholder="Stok">
                <button id="btnSaveProduct">Simpan Barang</button>
            </div>
            <div id="admin-prod-list"></div>
        </div>

        <div id="admin-rekening" class="tab-content hidden">
            <div class="card">
                <h3>Info Rekening Admin</h3>
                <textarea id="adminBank" placeholder="Contoh: DANA 0812xxx a/n Admin" rows="3"></textarea>
                <button id="btnSaveBank" class="btn-blue">Update Rekening</button>
            </div>
        </div>

        <div id="admin-pesanan" class="tab-content hidden">
            <h3>Pesanan Masuk</h3>
            <div id="admin-order-list"></div>
        </div>
        <button onclick="logout()" class="btn-gray">Logout Admin</button>
    </div>

    <!-- UI RESELLER -->
    <div id="ui-reseller" class="hidden">
        <!-- Dashboard Beranda -->
        <div id="res-beranda" class="res-page">
            <div class="card">
                <h3>Halo, <span id="resName">...</span></h3>
                <p>Poin Anda: <b class="gold" id="resPoints">0</b></p>
            </div>
            <div class="catalog-grid" id="catalog-list"></div>
            <button id="btnMore" class="btn-gray" style="margin-top:10px">▼ Lihat Katalog Lain</button>
        </div>

        <!-- Dashboard Keranjang -->
        <div id="res-cart" class="res-page hidden">
            <div class="tabs">
                <div class="tab active" onclick="switchResTab('tab-pesanan')">Pesanan</div>
                <div class="tab" onclick="switchResTab('tab-status')">Status</div>
            </div>
            <div id="tab-pesanan">
                <div id="res-unpaid-list"></div>
            </div>
            <div id="tab-status" class="hidden">
                <div id="res-status-list"></div>
            </div>
        </div>

        <!-- Modal Bayar -->
        <div id="modal-pay" class="card hidden">
            <h3>Form Pembayaran</h3>
            <p id="pay-order-id"></p>
            <input id="pay-nama" placeholder="Nama Lengkap">
            <textarea id="pay-alamat" placeholder="Alamat Lengkap"></textarea>
            <input id="pay-hp" placeholder="No. HP">
            <button id="btnSubmitPay" class="btn-green">KONFIRMASI BAYAR</button>
            <button onclick="closePay()" class="btn-gray">Batal</button>
        </div>

        <!-- Navigasi Bawah -->
        <div class="nav-bottom">
            <div class="nav-item active" onclick="showResPage('res-beranda')">🏠<br>Beranda</div>
            <div class="nav-item" onclick="showResPage('res-cart')">🛒<br>Keranjang</div>
            <div class="nav-item" onclick="logout()">🚪<br>Logout</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, collection, onSnapshot, updateDoc, increment, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBIQ0tuOUM015lyS3-IuzioR6YBIZwBoB0",
        authDomain: "reseller-oktshop17.firebaseapp.com",
        projectId: "reseller-oktshop17",
        storageBucket: "reseller-oktshop17.firebasestorage.app",
        messagingSenderId: "9176826607",
        appId: "1:9176826607:web:be8bcddd729bb43f31511a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentLimit = 4;
    let bankInfo = "Memuat...";

    // --- AUTH CHECK ---
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (userDoc.exists()) {
                const data = userDoc.data();
                if (data.role === 'admin') {
                    showUI('admin');
                    loadAdminData();
                } else {
                    showUI('reseller');
                    document.getElementById('resName').innerText = data.name;
                    document.getElementById('resPoints').innerText = data.points || 0;
                    loadResellerData();
                }
            } else {
                // Auto create for new users
                await setDoc(doc(db, "users", user.uid), { name: user.email.split('@')[0], role: 'reseller', points: 0 });
                location.reload();
            }
        } else {
            showUI('login');
        }
    });

    // --- LOGIN ---
    document.getElementById('btnLogin').onclick = async () => {
        const e = document.getElementById('email').value;
        const p = document.getElementById('pass').value;
        try { await signInWithEmailAndPassword(auth, e, p); } catch(err) { alert("Login Gagal: " + err.message); }
    };

    window.logout = () => signOut(auth).then(() => location.reload());

    function showUI(id) {
        ['ui-login', 'ui-admin', 'ui-reseller'].forEach(ui => document.getElementById(ui).classList.add('hidden'));
        document.getElementById('ui-' + id).classList.remove('hidden');
    }

    // --- ADMIN LOGIC ---
    function loadAdminData() {
        onSnapshot(collection(db, "products"), (snap) => {
            const list = document.getElementById('admin-prod-list');
            list.innerHTML = "";
            snap.forEach(d => {
                const p = d.data();
                list.innerHTML += `<div class="card">${p.name} - Rp${p.price.toLocaleString()} | Stok: ${p.stock}</div>`;
            });
        });
        
        onSnapshot(doc(db, "settings", "bank"), (d) => { if(d.exists()) document.getElementById('adminBank').value = d.data().info; });

        onSnapshot(query(collection(db, "orders"), orderBy("createdAt", "desc")), (snap) => {
            const list = document.getElementById('admin-order-list');
            list.innerHTML = "";
            snap.forEach(d => {
                const o = d.data();
                if(o.status === 'Batal') return;
                list.innerHTML += `
                <div class="order-card">
                    <b>#${o.orderID}</b> - ${o.userName}<br>
                    Barang: ${o.itemName}<br>
                    Total: Rp${o.total.toLocaleString()}<br>
                    Status: <span class="status-badge">${o.status}</span>
                    <div class="prod-btns">
                        <button onclick="updateStatus('${d.id}', 'Proses')" class="btn-blue">Proses</button>
                        <button onclick="updateStatus('${d.id}', 'Kirim')" class="btn-blue">Kirim</button>
                        <button onclick="updateStatus('${d.id}', 'Selesai', '${o.userID}', ${o.total})" class="btn-green">Selesai</button>
                    </div>
                </div>`;
            });
        });
    }

    document.getElementById('btnSaveProduct').onclick = async () => {
        const name = document.getElementById('pName').value;
        const price = parseInt(document.getElementById('pPrice').value);
        const stock = parseInt(document.getElementById('pStock').value);
        await setDoc(doc(db, "products", name), { name, price, stock });
        alert("Berhasil!");
    };

    document.getElementById('btnSaveBank').onclick = async () => {
        await setDoc(doc(db, "settings", "bank"), { info: document.getElementById('adminBank').value });
        alert("Rekening Diupdate!");
    };

    window.updateStatus = async (id, stat, uid, total) => {
        await updateDoc(doc(db, "orders", id), { status: stat });
        if(stat === 'Selesai' && uid) {
            const pointBonus = Math.floor(total / 1000);
            await updateDoc(doc(db, "users", uid), { points: increment(pointBonus) });
        }
        alert("Status Update!");
    };

    // --- RESELLER LOGIC ---
    function loadResellerData() {
        // Load Katalog
        onSnapshot(query(collection(db, "products"), limit(currentLimit)), (snap) => {
            const list = document.getElementById('catalog-list');
            list.innerHTML = "";
            snap.forEach(d => {
                const p = d.data();
                list.innerHTML += `
                <div class="prod-card">
                    <b>${p.name}</b><br>
                    <span class="prod-price">Rp${p.price.toLocaleString()}</span><br>
                    <small>Stok: ${p.stock}</small>
                    <div class="prod-btns">
                        <button class="btn-gray" onclick="window.open('https://wa.me/628xxx?text=Cek Stok ${p.name}')">Chat</button>
                        <button onclick="checkout('${p.name}', ${p.price})">Keranjang</button>
                    </div>
                </div>`;
            });
        });

        onSnapshot(doc(db, "settings", "bank"), (d) => { if(d.exists()) bankInfo = d.data().info; });

        // Load Orders for Reseller
        onSnapshot(query(collection(db, "orders"), orderBy("createdAt", "desc")), (snap) => {
            const unpaidList = document.getElementById('res-unpaid-list');
            const statusList = document.getElementById('res-status-list');
            unpaidList.innerHTML = statusList.innerHTML = "";
            
            snap.forEach(d => {
                const o = d.data();
                if(o.userID !== auth.currentUser.uid) return;

                // Check Expiry (60 mins)
                const now = new Date().getTime();
                const expiry = o.createdAt.toDate().getTime() + (60 * 60 * 1000);
                
                if(o.status === 'Menunggu Bayar' && now > expiry) {
                    updateDoc(doc(db, "orders", d.id), { status: 'Batal' });
                    return;
                }

                const cardHtml = `
                <div class="order-card">
                    <b>Order #${o.orderID}</b><br>
                    Item: ${o.itemName}<br>
                    Total: Rp${o.total.toLocaleString()}<br>
                    Status: <span class="status-badge">${o.status}</span><br>
                    ${o.status === 'Menunggu Bayar' ? `<button class="btn-green" onclick="openPay('${d.id}', '${o.orderID}')">BAYAR SEKARANG</button>` : ''}
                </div>`;

                if(o.status === 'Menunggu Bayar') unpaidList.innerHTML += cardHtml;
                else if(o.status !== 'Batal') statusList.innerHTML += cardHtml;
            });
        });
    }

    document.getElementById('btnMore').onclick = () => {
        currentLimit += 4;
        loadResellerData();
    };

    window.checkout = async (name, price) => {
        const snap = await getDoc(doc(db, "settings", "counter"));
        let count = 1;
        if(snap.exists()) count = snap.data().val + 1;
        const orderID = String(count).padStart(5, '0');
        
        const newOrder = {
            orderID,
            userID: auth.currentUser.uid,
            itemName: name,
            total: price,
            status: 'Menunggu Bayar',
            createdAt: serverTimestamp()
        };
        
        await setDoc(doc(db, "orders", "order_"+orderID), newOrder);
        await setDoc(doc(db, "settings", "counter"), { val: count });
        alert("Masuk Keranjang! Silakan bayar dalam 60 menit.");
        showResPage('res-cart');
    };

    // --- PAYMENT FLOW ---
    let activeOrderID = "";
    window.openPay = (id,oid) => {
        activeOrderID = id;
        document.getElementById('pay-order-id').innerText = "Order #" + oid;
        document.getElementById('modal-pay').classList.remove('hidden');
    };
    window.closePay = () => document.getElementById('modal-pay').classList.add('hidden');

    document.getElementById('btnSubmitPay').onclick = async () => {
        const n = document.getElementById('pay-nama').value;
        const a = document.getElementById('pay-alamat').value;
        const h = document.getElementById('pay-hp').value;
        if(!n || !a || !h) return alert("Lengkapi data!");

        await updateDoc(doc(db, "orders", activeOrderID), {
            userName: n, userAddress: a, userPhone: h, status: 'Sudah Bayar'
        });
        alert("Silakan Transfer ke:\n" + bankInfo);
        closePay();
    };

    // --- UI HELPER ---
    window.switchTab = (id) => {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.remove('hidden');
        event.target.classList.add('active');
    };

    window.showResPage = (id) => {
        document.querySelectorAll('.res-page').forEach(p => p.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        // logic active nav highlight
    };

    window.switchResTab = (id) => {
        document.getElementById('tab-pesanan').classList.add('hidden');
        document.getElementById('tab-status').classList.add('hidden');
        document.getElementById(id).classList.remove('hidden');
    };

</script>
</body>
</html>
