<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>OKTSHOP17 - Firebase Edition</title>
    <style>
        body{font-family:'Segoe UI',Arial,sans-serif;background:#111;color:#fff;margin:0;padding:20px}
        .wrap{max-width:500px;margin:auto}
        .card{background:#1f1f1f;padding:20px;border-radius:18px;margin-bottom:14px;box-shadow:0 4px 15px rgba(0,0,0,0.5)}
        .hidden{display:none}
        input,select,button{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:1px solid #333;background:#2a2a2a;color:#fff;box-sizing:border-box}
        button{background:#e60000;color:#fff;font-weight:700;cursor:pointer;border:none;transition:0.3s}
        button:hover{background:#ff1a1a}
        .gold{color:#ffd700;text-align:center}
        .item-list{margin-top:15px;border-top:1px solid #333;padding-top:10px}
        .product-card{background:#2a2a2a;padding:10px;margin-bottom:8px;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
        .stock-low{color:#ff4444;font-weight:bold}
        .price{color:#00ff66;font-weight:bold}
        .loading { text-align: center; color: #ffd700; }
    </style>
</head>
<body>

<div class='wrap'>
    <div class='card'><h1 class='gold'>OKTSHOP17</h1><p style="text-align:center">Reseller & Admin System</p></div>

    <!-- LOADING SPINNER -->
    <div id="loading" class="loading hidden">Memuat data...</div>

    <!-- UI LOGIN -->
    <div class='card' id='ui-login'>
        <h3>Login</h3>
        <input id='email' type="email" placeholder='Email (admin@okt.com)'>
        <input id='pass' type='password' placeholder='Password'>
        <button id="btnLogin">Masuk</button>
        <p id="loginStatus" style="font-size:12px; color:gray; text-align:center; margin-top:10px"></p>
    </div>

    <!-- UI RESELLER -->
    <div class='card hidden' id='ui-reseller'>
        <h3>Halo, <span id='resellerName'>...</span></h3>
        <p>Saldo Poin: <b class="gold" id="resellerPoints">0</b></p>
        <div class="item-list" id="productListReseller"></div>
        <button id="btnLogoutReseller">Logout</button>
    </div>

    <!-- UI ADMIN -->
    <div class='card hidden' id='ui-admin'>
        <h3>Panel Admin</h3>
        <div style="background:#2a2a2a; padding:10px; border-radius:10px; margin-bottom:10px">
            <small>Tambah/Update Produk:</small>
            <input id="pName" placeholder="Nama Barang">
            <input id="pPrice" type="number" placeholder="Harga (Rp)">
            <input id="pStock" type="number" placeholder="Jumlah Stok">
            <button id="btnSaveProduct" style="background:#007bff">Simpan Barang</button>
        </div>
        <div class="item-list" id="productListAdmin"></div>
        <button id="btnLogoutAdmin">Logout</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, collection, onSnapshot, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBIQ0tuOUM015lyS3-IuzioR6YBIZwBoB0",
  authDomain: "reseller-oktshop17.firebaseapp.com",
  databaseURL: "https://reseller-oktshop17-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "reseller-oktshop17",
  storageBucket: "reseller-oktshop17.firebasestorage.app",
  messagingSenderId: "9176826607",
  appId: "1:9176826607:web:be8bcddd729bb43f31511a",
  measurementId: "G-WC9BY9GQZE"
};
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginUI = document.getElementById('ui-login');
    const adminUI = document.getElementById('ui-admin');
    const resellerUI = document.getElementById('ui-reseller');
    const loading = document.getElementById('loading');

    // --- CEK STATUS LOGIN (AUTO-LOGIN) ---
    onAuthStateChanged(auth, (user) => {
        if (user) {
            checkRole(user.uid);
        } else {
            showUI('login');
        }
    });

    async function checkRole(uid) {
        showLoading(true);
        try {
            const userDoc = await getDoc(doc(db, "users", uid));
            if (userDoc.exists()) {
                const data = userDoc.data();
                if (data.role === 'admin') {
                    showUI('admin');
                    loadAdminPanel();
                } else {
                    showUI('reseller');
                    document.getElementById('resellerName').innerText = data.name || "User";
                    document.getElementById('resellerPoints').innerText = data.points || 0;
                    loadResellerPanel();
                }
            } else {
                // JIKA USER AUTH ADA TAPI DI FIRESTORE BELUM ADA
                alert("Akun terdaftar tapi data profil tidak ditemukan di Firestore. Hubungi IT.");
                await signOut(auth);
            }
        } catch (err) {
            console.error(err);
            alert("Terjadi kesalahan saat mengambil data user.");
        }
        showLoading(false);
    }

    // --- FUNGSI LOGIN ---
    document.getElementById('btnLogin').onclick = async () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('pass').value;
        const status = document.getElementById('loginStatus');

        if(!email || !pass) return alert("Isi email dan password!");

        try {
            status.innerText = "Menghubungkan...";
            await signInWithEmailAndPassword(auth, email, pass);
        } catch (e) {
            status.innerText = "Error: " + e.code;
            console.error(e);
            if(e.code === 'auth/user-not-found') alert("Email tidak terdaftar!");
            else if(e.code === 'auth/wrong-password') alert("Password salah!");
            else alert("Gagal masuk: " + e.message);
        }
    };

    // --- LOGOUT ---
    const logoutAction = () => signOut(auth).then(() => location.reload());
    document.getElementById('btnLogoutReseller').onclick = logoutAction;
    document.getElementById('btnLogoutAdmin').onclick = logoutAction;

    // --- TAMPILAN HELPER ---
    function showUI(mode) {
        loginUI.classList.add('hidden');
        adminUI.classList.add('hidden');
        resellerUI.classList.add('hidden');
        if(mode === 'login') loginUI.classList.remove('hidden');
        if(mode === 'admin') adminUI.classList.remove('hidden');
        if(mode === 'reseller') resellerUI.classList.remove('hidden');
    }

    function showLoading(show) {
        loading.classList.toggle('hidden', !show);
    }

    // --- ADMIN LOGIC ---
    document.getElementById('btnSaveProduct').onclick = async () => {
        const name = document.getElementById('pName').value;
        const price = parseInt(document.getElementById('pPrice').value);
        const stock = parseInt(document.getElementById('pStock').value);
        if(!name || isNaN(price)) return alert("Isi data dengan benar!");
        await setDoc(doc(db, "products", name), { name, price, stock }, { merge: true });
        alert("Berhasil!");
    };

    function loadAdminPanel() {
        onSnapshot(collection(db, "products"), (snap) => {
            const list = document.getElementById('productListAdmin');
            list.innerHTML = "";
            snap.forEach(docSnap => {
                const p = docSnap.data();
                list.innerHTML += `<div class="product-card">
                    <div><b>${p.name}</b><br><small>Rp${p.price.toLocaleString()} | Stok: ${p.stock}</small></div>
                    <button style="width:70px" onclick="editStock('${p.name}')">Edit</button>
                </div>`;
            });
        });
    }

    // --- RESELLER LOGIC ---
    function loadResellerPanel() {
        onSnapshot(collection(db, "products"), (snap) => {
            const list = document.getElementById('productListReseller');
            list.innerHTML = "";
            snap.forEach(docSnap => {
                const p = docSnap.data();
                list.innerHTML += `<div class="product-card">
                    <div><b>${p.name}</b><br><span class="price">Rp ${p.price.toLocaleString()}</span><br>
                    <small class="${p.stock < 5 ? 'stock-low' : ''}">Stok: ${p.stock}</small></div>
                    <button style="width:80px" ${p.stock <= 0 ? 'disabled' : ''} onclick="buyProduct('${p.name}', ${p.price})">
                    ${p.stock <= 0 ? 'Habis' : 'Beli'}</button>
                </div>`;
            });
        });
    }

    window.buyProduct = async (name, price) => {
        if (!confirm(`Beli ${name}?`)) return;
        const pRef = doc(db, "products", name);
        const uRef = doc(db, "users", auth.currentUser.uid);
        try {
            await updateDoc(pRef, { stock: increment(-1) });
            await updateDoc(uRef, { points: increment(Math.floor(price/100)) });
            alert("Berhasil!");
        } catch(e) { alert("Gagal: " + e.message); }
    };

    window.editStock = (name) => {
        const nS = prompt("Stok baru:");
        const nP = prompt("Harga baru (kosongkan jika tidak):");
        if (nS !== null) {
            const d = { stock: parseInt(nS) };
            if (nP) d.price = parseInt(nP);
            updateDoc(doc(db, "products", name), d);
        }
    };
</script>
</body>
</html>
